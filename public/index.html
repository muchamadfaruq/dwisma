<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Portal Aplikasi SMAN 2 Mengwi</title>
    <link rel="shortcut icon" href="/img/favicon.ico" />

    <!-- PWA Support -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="stylesheet" href="/css/styles.css" />
    <meta name="theme-color" content="#0061ff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Dwisma Portal" />
    <link rel="apple-touch-icon" href="/img/Logo Dwisma.png" />
    <meta name="description"
        content="Portal aplikasi resmi SMAN 2 Mengwi – akses semua layanan sekolah dalam satu tempat." />

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Icons & Fonts -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Merriweather:ital,wght@0,700;1,700&display=swap"
        rel="stylesheet" />

    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        merriweather: ['Merriweather', 'serif'],
                    },
                    colors: {
                        dwisma: { blue: '#0061ff', dark: '#0f172a', light: '#f8f9fa' }
                    },
                    boxShadow: {
                        'glass': '0 8px 32px 0 rgba(31, 38, 135, 0.05)',
                        'icon': '0 10px 20px -5px rgba(0,0,0,0.1)',
                    },
                    animation: {
                        'fade-in-up': 'fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'float': 'float 6s ease-in-out infinite',
                        'blob': 'blob 10s infinite',
                        'gradient-text': 'gradient 8s linear infinite',
                    },
                    keyframes: {
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(30px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-15px)' },
                        },
                        blob: {
                            '0%': { transform: 'translate(0px, 0px) scale(1)' },
                            '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                            '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                            '100%': { transform: 'translate(0px, 0px) scale(1)' },
                        },
                        gradient: {
                            '0%': { backgroundPosition: '0% 50%' },
                            '50%': { backgroundPosition: '100% 50%' },
                            '100%': { backgroundPosition: '0% 50%' },
                        }
                    }
                }
            }
        }
    </script>

    <!-- Terapkan dark mode lebih awal agar tidak berkedip -->
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('dwisma-dark');
                var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (saved !== null ? saved === '1' : prefersDark) {
                    document.documentElement.classList.add('dark');
                }
            } catch (e) { }
        })();
    </script>
</head>

<body>
    <div id="app"></div>
    <script src="/js/portal.js" defer></script>
</body>

</html>
