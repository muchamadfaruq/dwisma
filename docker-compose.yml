services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATA_DIR=/data
      - SEED_DIR=/seed
      - PUBLIC_DIR=/app/public
    env_file:
      - path: .env
        required: false
    volumes:
      - dwisma_data:/data
      - ./data:/seed:ro
      - /proc/net/arp:/host-arp:ro
    ports:
      - "127.0.0.1:8080:3000"
    networks:
      - default
      - npm
    restart: unless-stopped

volumes:
  dwisma_data:
    name: dwisma_data

networks:
  default:
    name: dwisma_default
  npm:
    external: true
    name: nginx-proxy-manager_default
